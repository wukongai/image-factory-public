name: Public release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r skills/image-factory/requirements.txt
      - run: python -m unittest discover -s skills/image-factory/tests -p 'test_*.py'
      - run: python skills/image-factory/scripts/check_public_release.py
